services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paisa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paisa}
      POSTGRES_DB: paisa_dev
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - paisa-postgres:/var/lib/postgresql/data
      - ./scripts/init_test_db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paisa -d paisa_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  paisa-postgres:
